# Local database for the app. Start it with: docker compose up -d --wait
# It uses port 5433, so it can run beside another Postgres on the usual port, 5432.
services:
  postgres:
    image: postgres:18.6
    container_name: content-compliance-postgres
    environment:
      POSTGRES_USER: compliance
      POSTGRES_DB: compliance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env. See .env.example}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compliance -d compliance"]
      interval: 2s
      timeout: 5s
      retries: 15
    restart: unless-stopped

volumes:
  pgdata:
